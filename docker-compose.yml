services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: blastradius-falkordb
    ports:
      - "6379:6379"   # graph database (Redis protocol)
      - "3000:3000"   # FalkorDB Browser UI
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    restart: unless-stopped

volumes:
  falkordb-data:
